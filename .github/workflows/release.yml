name: Release

# Tag to build, test and submit to both stores. The listings already exist;
# this updates them, and going live is gated by store review.
#
# `v3.*` rather than `v*`: v2.5.1's tags share this repo, and `v*` would match
# them. The tag must also agree with the manifest — checked below, because a
# mismatch is only discovered at submit time otherwise.
on:
  push:
    tags: ['v3.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Everything here mirrors ci.yml deliberately: a release that runs a
      # different, smaller check than every PR is a release nobody has tested.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Asked before anything is built, because it is the question the rest of
      # this workflow assumes. A key can be valid, read the add-on's details
      # and upload a ZIP, and still be refused at the last step with a 403 —
      # that is what happened to 3.0.0, and nothing here caught it: `--dry-run`
      # stops BEFORE the submit call, so it exercises the credentials without
      # ever testing whether they may publish.
      - name: Can these credentials publish this add-on?
        run: node scripts/check-amo-access.mjs
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npm run fetch:test-deps

      - run: npm test
        env:
          PM_REQUIRE_FULL_SUITE: '1'

      - name: The tag and the manifest must agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MANIFEST=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "tag $GITHUB_REF_NAME says $TAG, package.json says $MANIFEST"
            exit 1
          fi

      - run: npm run zip

      # Firefox is submitted automatically; Chrome only if its secrets exist.
      #
      # AMO hands you a key and a secret on the Developer Hub and that is the
      # whole setup. Chrome's V1 API wants a Google Cloud project, an OAuth
      # consent screen, a client, and a refresh token that expires after seven
      # days unless the consent screen is published — and V1 is retired on
      # 15 October 2026, so that ceremony buys a month. V2 replaces it with a
      # service account, which is genuinely simpler, but it is not set up here
      # yet and a release should not wait on it.
      #
      # So the Chrome zip is built, checked and kept as an artifact, and
      # uploaded by hand on the Developer Dashboard — which is what 2.5.1 did,
      # takes two minutes, and happens a few times a year. When the Chrome
      # secrets are added this step starts including it with no further change.
      - name: Is Chrome automated?
        id: chrome
        run: |
          if [ -n "${{ secrets.CHROME_CLIENT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Chrome secrets are not set, so only Firefox is submitted. Download release-zips below and upload the -chrome.zip on the Developer Dashboard."
          fi

      - name: Submit to Firefox
        run: npx wxt submit --firefox-zip .output/*-firefox.zip --firefox-sources-zip .output/*-sources.zip
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Submit to Chrome
        if: steps.chrome.outputs.enabled == 'true'
        run: npx wxt submit --chrome-zip .output/*-chrome.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}

      - name: Keep the artifacts that were submitted
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: .output/*.zip
          # `.output` starts with a dot, and upload-artifact treats a dotted
          # path segment as hidden and skips it — so the glob matched nothing
          # and the step "succeeded" having uploaded zero files, with only a
          # warning to say so. The Chrome zip is uploaded BY HAND from this
          # artifact, so losing it quietly means the release produced nothing
          # anyone can ship.
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
