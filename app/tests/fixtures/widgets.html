<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Widgets</title></head>
<body>
  <main>
    <h2 data-spike="section-heading">Account settings</h2>

    <button data-testid="save-settings" data-spike="testid-button">Save</button>

    <label for="country">Country</label>
    <select id="country" data-spike="country-select">
      <option>United Kingdom</option>
      <option>United States</option>
    </select>

    <input type="text" aria-label="Search products" data-spike="aria-label-input" />

    <textarea placeholder="Leave a comment" data-spike="comment-textarea"></textarea>

    <a href="/help" title="Open help center" data-spike="title-link">?</a>

    <div role="alert" data-spike="alert-region">Your session is about to expire.</div>

    <input type="radio" name="plan" id="plan-pro" data-spike="radio-pro" />
    <label for="plan-pro">Pro plan</label>

    <p data-spike="unique-paragraph">This is a unique descriptive paragraph of text.</p>
  </main>
</body>
</html>
