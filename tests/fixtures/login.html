<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Login</title></head>
<body>
  <!-- Fixture navigation, for hand-testing. Deliberately outside <main>
       so it does not change the breadcrumb of anything inside it, and
       labelled with filenames so no link text can collide with a tagged
       element's accessible name. -->
  <nav aria-label="Fixtures" style="font: 12px/1.6 ui-monospace, monospace; padding: 6px 8px; border-bottom: 1px solid #ddd; margin-bottom: 12px">
    fixtures: <strong>login</strong> · <a href="widgets.html">widgets</a> · <a href="edgecases.html">edgecases</a> · <a href="ambiguous.html">ambiguous</a> · <a href="frames.html">frames</a> · <a href="frameset.html">frameset</a>
  </nav>
  <header>
    <nav aria-label="Primary">
      <a href="/" data-spike="nav-home">Home</a>
      <a href="/about" data-spike="nav-about">About</a>
    </nav>
  </header>

  <main>
    <h1 data-spike="page-heading">Sign in to your account</h1>

    <form>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" placeholder="you@example.com" data-spike="email-input" />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Your password" data-spike="password-input" />

      <label>
        <input type="checkbox" name="remember" data-spike="remember-checkbox" />
        Remember me
      </label>

      <button type="submit" data-spike="submit-button">Sign in</button>
    </form>

    <a href="/forgot" data-spike="forgot-link">Forgot your password?</a>

    <button type="button" aria-label="Close dialog" data-spike="icon-close">
      <svg width="16" height="16" aria-hidden="true"><path d="M0 0L16 16" data-spike="svg-path" /></svg>
    </button>

    <img src="logo.png" alt="Acme Corporation logo" data-spike="logo-img" />
  </main>
</body>
</html>
