<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Accname / role edge cases</title>
  <style>
    /* CSS-generated label content — Playwright includes it in the accessible name; many
       accname libraries do not read pseudo-element content. Classic divergence probe. */
    .with-css-prefix::before { content: "Download "; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <!-- Fixture navigation, for hand-testing. Deliberately outside <main>
       so it does not change the breadcrumb of anything inside it, and
       labelled with filenames so no link text can collide with a tagged
       element's accessible name. -->
  <nav aria-label="Fixtures" style="font: 12px/1.6 ui-monospace, monospace; padding: 6px 8px; border-bottom: 1px solid #ddd; margin-bottom: 12px">
    fixtures: <a href="login.html">login</a> · <a href="widgets.html">widgets</a> · <strong>edgecases</strong> · <a href="ambiguous.html">ambiguous</a> · <a href="frames.html">frames</a> · <a href="frameset.html">frameset</a>
  </nav>
  <main>
    <!-- 1. aria-label overrides emoji/content -->
    <button aria-label="Save document" data-spike="aria-label-btn">💾</button>

    <!-- 2. aria-labelledby concatenation across two elements -->
    <span id="lbl-first">First</span><span id="lbl-last">name</span>
    <input type="text" aria-labelledby="lbl-first lbl-last" data-spike="labelledby-input" />

    <!-- 3. name from title attribute fallback only -->
    <input type="text" title="Phone number" data-spike="title-only-input" />

    <!-- 4. name from placeholder fallback only -->
    <input type="text" placeholder="Enter city" data-spike="placeholder-only-input" />

    <!-- 5. empty alt => presentational image, no accessible name -->
    <img src="spacer.png" alt="" data-spike="empty-alt-img" />

    <!-- 6. svg exposed as image via role + aria-label -->
    <svg role="img" aria-label="Search" width="16" height="16" data-spike="svg-img"><path d="M0 0L16 16" /></svg>

    <!-- 7. role override on a div; name from content -->
    <div role="button" tabindex="0" data-spike="div-button">Click me</div>

    <!-- 8. heading name from concatenated child content -->
    <h2 data-spike="nested-heading">Hello <strong>World</strong></h2>

    <!-- 9. whitespace normalization in link text -->
    <a href="/read" data-spike="ws-link">  Read   more  </a>

    <!-- 9b. a multi-line attribute value. A CSS string may not contain a raw
         newline, so an unescaped one threw SyntaxError out of querySelectorAll
         and killed the whole scan — no rows, no error, picker still armed.
         Wrapped title/alt/aria-label is ordinary CMS markup. -->
    <a href="/report" data-spike="wrapped-title" title="Open the report
in a new window">Report</a>

    <!-- 9c. a link whose rendered text differs from its textContent. WebDriver
         matches what is DISPLAYED, so the hidden span must not reach the
         locator — the Bootstrap `d-none d-md-inline` responsive-label shape. -->
    <style>.pm-hidden-part { display: none }</style>
    <a href="/pricing" data-spike="responsive-link">Read more<span class="pm-hidden-part"> about pricing</span></a>

    <!-- 9d. a required marker drawn with ::before on a replaced element. A
         pseudo-element never renders on an <input>, but getComputedStyle still
         reports the declared content, so folding it into the accessible name
         invented "* Email address" and every locator built from it matched
         nothing. -->
    <style>input.pm-req::before { content: "* " }</style>
    <label for="req-email">Email address</label>
    <input id="req-email" class="pm-req" data-spike="required-marked">

    <!-- 9e. two elements sharing one aria-label, only one of them a form
         control. getByLabel matches both, so a resolver that filters to
         INPUT/SELECT/TEXTAREA under-counts and certifies a locator that
         raises a strict-mode violation. -->
    <input aria-label="Quick search" data-spike="labelled-input">
    <button aria-label="Quick search" data-spike="labelled-button">Go</button>

    <!-- 10. CSS ::before contributes to the accessible name (divergence probe) -->
    <button class="with-css-prefix" data-spike="css-before-btn">file</button>

    <!-- 11. display:none — inaccessible; Playwright getByRole won't match it -->
    <button style="display:none" data-spike="hidden-display-btn">Hidden action</button>

    <!-- 12. aria-hidden — removed from a11y tree -->
    <button aria-hidden="true" data-spike="aria-hidden-btn">Ghost action</button>

    <!-- 13. visibility:hidden -->
    <input type="text" aria-label="Invisible field" style="visibility:hidden" data-spike="visibility-hidden-input" />

    <!-- 14. submit input: name from value attribute -->
    <input type="submit" value="Send form" data-spike="submit-value-input" />

    <!-- 15. fieldset/legend => group with name -->
    <fieldset data-spike="fieldset-group">
      <legend>Billing details</legend>
      <input type="text" aria-label="Card" />
    </fieldset>

    <!-- 16. aria-label overrides visible text on a link -->
    <a href="/home" aria-label="Go to homepage" data-spike="link-arialabel-overrides">Home</a>

    <!-- 17. accessible name from a visually-hidden labelledby target -->
    <span id="vh-label" class="visually-hidden">Toggle navigation menu</span>
    <button aria-labelledby="vh-label" data-spike="vh-labelledby-btn"><span aria-hidden="true">☰</span></button>

    <!-- 18. duplicate accessible name (ambiguous role+name) -->
    <button data-spike="dup-name-a">Continue</button>
    <button data-spike="dup-name-b">Continue</button>
    <!-- A hidden control inside a visible box: the eye has nothing of its own to
       outline, so it marks the nearest ancestor that does have one. -->
  <div id="hidden-host" style="width: 200px; height: 40px; border: 1px solid #ccc">
    <button data-spike="hidden-in-visible-parent" style="display: none">Ghost action</button>
  </div>
</main>
</body>
</html>
