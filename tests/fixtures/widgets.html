<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Widgets</title></head>
<body>
  <!-- Fixture navigation, for hand-testing. Deliberately outside <main>
       so it does not change the breadcrumb of anything inside it, and
       labelled with filenames so no link text can collide with a tagged
       element's accessible name. -->
  <nav aria-label="Fixtures" style="font: 12px/1.6 ui-monospace, monospace; padding: 6px 8px; border-bottom: 1px solid #ddd; margin-bottom: 12px">
    fixtures: <a href="login.html">login</a> · <strong>widgets</strong> · <a href="edgecases.html">edgecases</a> · <a href="ambiguous.html">ambiguous</a> · <a href="frames.html">frames</a> · <a href="frameset.html">frameset</a>
  </nav>
  <main>
    <h2 data-spike="section-heading">Account settings</h2>

    <button data-testid="save-settings" data-spike="testid-button">Save</button>

    <label for="country">Country</label>
    <select id="country" data-spike="country-select">
      <option>United Kingdom</option>
      <option>United States</option>
    </select>

    <input type="text" aria-label="Search products" data-spike="aria-label-input" />

    <textarea placeholder="Leave a comment" data-spike="comment-textarea"></textarea>

    <a href="/help" title="Open help center" data-spike="title-link">?</a>

    <div role="alert" data-spike="alert-region">Your session is about to expire.</div>

    <input type="radio" name="plan" id="plan-pro" data-spike="radio-pro" />
    <label for="plan-pro">Pro plan</label>

    <!-- A range. Its role is `slider`, and Selenium's text setter is actively
         wrong on it: clear() jumps it to the middle of its span and send_keys
         does nothing. Modelled as its own bucket for that reason. -->
    <label for="volume">Volume</label>
    <input type="range" id="volume" name="volume" min="0" max="10" value="3" data-spike="volume-slider" />

    <p data-spike="unique-paragraph">This is a unique descriptive paragraph of text.</p>

    <!-- A control built from divs, wrapped in a plain one. The two have the same
         bounding box, so the overlay label is the only way to tell which you are
         about to pick. -->
    <div class="cta-wrapper" style="padding: 12px">
      <div role="button" tabindex="0" data-spike="div-button">Continue to checkout</div>
    </div>
  </main>
</body>
</html>
